[package]
name = "probe"
version = "1.0.1"
description = "VoiceBro development probes: live checks of external APIs with pass criteria. Not shipped."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "probe"
path = "src/main.rs"

[dependencies]
voicebro-core.workspace = true
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }

# The Opus binding songbird 0.6.1 links, so libopus is built once (needs CMake).
opus2 = "0.4"
# In-process WebRTC. `rtc` is the sans-io core the `webrtc` crate re-exports parts of.
webrtc = "0.21"
rtc = "0.21"
bytes = "1"
futures = "0.3"
async-trait = "0.1"
rand = "0.9"
# WAV in and out for the call probe.
hound = "3.5"
# Discord voice: a real channel for the lifecycle and timing probes.
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend"] }
songbird = { version = "0.6.1", default-features = false, features = ["serenity", "rustls", "driver", "gateway", "tungstenite", "receive"] }
symphonia-core = "0.5.2"
# songbird's RawAdapter produces f32 PCM; decoding it needs symphonia's `pcm` feature, which
# the application has to turn on (songbird does not).
symphonia = { version = "0.5.2", default-features = false, features = ["pcm"] }
# Credential Manager, asset hashes, Vosk at runtime.
sha2 = "0.11"
libloading = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

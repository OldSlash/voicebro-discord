[package]
name = "voicebro-server"
version = "1.3.1"
description = "VoiceBro's native headless Discord voice bot"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["signal"] }
voicebro-core.workspace = true
# Local time in the log lines; already in Cargo.lock through the core.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# `--set-token` reads the token without echo.
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
# `--set-token` reads the token without echo (not tested).
libc = "0.2"

    <h2>Hotkey probe (P0.9)</h2>
    <p>This window registers the global shortcut <code>Ctrl+Alt+M</code>.</p>
    <p>Bring a full-screen game to the front and press it a few times. Every press is
      printed to the console that started <code>cargo run -p probe-hotkey</code>, with a
      timestamp. Close this window when done.</p>

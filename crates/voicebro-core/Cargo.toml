[package]
name = "voicebro-core"
version = "1.3.0"
description = "VoiceBro application core: settings, secrets, events, Discord, wake word, runtime. No Tauri dependency."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend"] }
songbird = { version = "0.6.1", default-features = false, features = ["serenity", "rustls", "driver", "gateway", "tungstenite", "receive"] }
symphonia-core = "0.5.2"
# songbird's RawAdapter carries f32 PCM; decoding it needs symphonia's `pcm` feature.
symphonia = { version = "0.5.2", default-features = false, features = ["pcm"] }
# Wake word: the recognizer library is loaded at runtime; downloads are hash-checked.
libloading = "0.9"
sha2 = "0.11"
# Codex: the realtime call runs over WebRTC inside the process. `rtc` is the sans-io core
# the `webrtc` crate re-exports parts of; `opus2` is the Opus binding songbird links.
webrtc = "0.21"
rtc = "0.21"
opus2 = "0.4"
# The pure-Rust Opus codec next to libopus (change `opus-codec-experiment`), selected by
# `diagnostics.opus_codec`. Pinned: an update is a decision with its own comparison run.
opus-rs = "=0.1.42"
bytes = "1"
async-trait = "0.1"
rand = "0.9"
# Local dates for the daily chat log file.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# OpenCode's local server (change `claude-and-opencode-engines`, design D7): HTTP on
# 127.0.0.1 and its event stream. The version and the `stream` feature serenity already
# brings, without default features, so the lock file gains no crate.
reqwest = { version = "0.12.28", default-features = false, features = ["stream"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# The voices Windows has (change `whisper-mode`): OneCore speech through WinRT. 0.62 is
# already in the lock file through Tauri.
windows = { version = "0.62.2", features = ["Media_Core", "Media_SpeechSynthesis", "Storage_Streams", "Foundation", "Foundation_Collections"] }

[dev-dependencies]
tempfile = "3"
